<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Phyllotaxis Chaos — 秩序ある葉の生成</title>
<style>
  :root{
    --black:   #0a0d0a;
    --black-2: #12160f;
    --gray-1:  #3a4238;
    --gray-2:  #6b756a;
    --gray-3:  #9aa396;
    --green-1: #1f3d2a;
    --green-2: #3d6b47;
    --green-3: #6fa876;
    --green-4: #a8d5ab;
    --paper:   #e8ece5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--black);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--paper);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    touch-action:none;
  }

  /* ---- title mark, quiet corner ---- */
  #mark{
    position:absolute; top:22px; left:26px;
    pointer-events:none;
    line-height:1.3;
  }
  #mark .ja{
    font-size:19px;
    letter-spacing:0.14em;
    color:var(--green-4);
    opacity:0.85;
  }
  #mark .sub{
    font-size:13px;
    color:var(--gray-2);
    letter-spacing:0.06em;
    margin-top:3px;
  }

  /* ---- control panel ---- */
  #panel{
    position:absolute; bottom:0; left:0; right:0;
    padding:16px 22px 18px;
    background:linear-gradient(180deg, rgba(10,13,10,0) 0%, rgba(10,13,10,0.86) 32%, rgba(10,13,10,0.94) 100%);
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    gap:22px 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transition: opacity 0.5s ease;
  }
  #panel.hidden{ opacity:0; pointer-events:none; }

  .ctrl{ display:flex; flex-direction:column; gap:8px; min-width:150px; }
  .ctrl label{
    font-size:13.5px;
    color:var(--gray-3);
    display:flex; justify-content:space-between;
    letter-spacing:0.02em;
  }
  .ctrl label .val{ color:var(--green-4); font-variant-numeric: tabular-nums; }

  input[type=range]{
    -webkit-appearance:none;
    width:100%; height:4px;
    background:var(--gray-1);
    outline:none;
    border-radius:2px;
    touch-action:pan-y;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--green-3);
    cursor:pointer;
    border:1px solid var(--black-2);
    transition: background 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ background:var(--green-4); }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%;
    background:var(--green-3); cursor:pointer; border:1px solid var(--black-2);
  }

  .actions{ display:flex; gap:10px; align-items:center; margin-left:auto; }
  button{
    background:transparent;
    border:1px solid var(--gray-1);
    color:var(--gray-3);
    font-size:14px;
    padding:10px 16px;
    letter-spacing:0.04em;
    cursor:pointer;
    font-family:inherit;
    transition: all 0.2s;
  }
  button:hover{
    border-color:var(--green-3);
    color:var(--green-4);
  }

  #toggleHide{
    position:absolute; bottom:16px; right:20px;
    background:transparent; border:none; color:var(--gray-2);
    font-size:13px; letter-spacing:0.08em; cursor:pointer;
    padding:8px 12px;
    opacity:0.7;
  }
  #toggleHide:hover{ opacity:1; color:var(--green-4); }

  #readout{
    position:absolute; top:22px; right:26px;
    text-align:right;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:13px;
    color:var(--gray-2);
    letter-spacing:0.04em;
    line-height:1.7;
    pointer-events:none;
  }
  #readout .r-val{ color:var(--green-3); font-variant-numeric: tabular-nums; }

  #dragHint{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--gray-3);
    opacity:0;
    pointer-events:none;
    background:rgba(10,13,10,0.55);
    padding:8px 14px;
    border-radius:4px;
    transition:opacity 0.4s;
    white-space:nowrap;
  }
  #dragHint.show{ opacity:0.9; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="mark">
    <div class="ja">葉序と写像</div>
    <div class="sub">phyllotaxis · logistic map</div>
  </div>

  <div id="readout">
    <div>r = <span class="r-val" id="rReadout">3.700</span></div>
    <div id="regimeReadout">chaotic regime</div>
  </div>

  <div id="dragHint">drag ← → speed · drag ↑ ↓ size</div>

  <div id="panel">
    <div class="ctrl">
      <label>growth rate r <span class="val" id="rLabel">3.70</span></label>
      <input type="range" id="rSlider" min="2.4" max="4.0" step="0.001" value="3.70">
    </div>
    <div class="ctrl">
      <label>golden angle drift <span class="val" id="angleJitterLabel">0.35</span></label>
      <input type="range" id="angleJitterSlider" min="0" max="1.2" step="0.01" value="0.35">
    </div>
    <div class="ctrl">
      <label>density <span class="val" id="densityLabel">520</span></label>
      <input type="range" id="densitySlider" min="80" max="1400" step="10" value="520">
    </div>
    <div class="ctrl">
      <label>spawn speed <span class="val" id="speedLabel">1.0</span></label>
      <input type="range" id="speedSlider" min="0.1" max="4" step="0.05" value="1.0">
    </div>
    <div class="ctrl">
      <label>leaf size <span class="val" id="sizeLabel">1.0</span></label>
      <input type="range" id="sizeSlider" min="0.3" max="3" step="0.05" value="1.0">
    </div>
    <div class="ctrl">
      <label>trail / fade <span class="val" id="fadeLabel">0.06</span></label>
      <input type="range" id="fadeSlider" min="0.01" max="0.25" step="0.005" value="0.06">
    </div>

    <div class="actions">
      <button id="btnPause">一時停止</button>
      <button id="btnReset">最初から</button>
    </div>
  </div>

  <button id="toggleHide">操作パネルを隠す ⌄</button>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palette ----------
  const GREENS = ['#1f3d2a', '#2c5236', '#3d6b47', '#5a8f5f', '#6fa876', '#8fc191', '#a8d5ab'];
  const GRAYS  = ['#2a2f28', '#3a4238', '#565f52', '#6b756a', '#8a938a'];
  function pickGreen(t){
    // t in [0,1] biases toward darker (0) or lighter (1)
    const i = Math.max(0, Math.min(GREENS.length-1, Math.floor(t * GREENS.length)));
    return GREENS[i];
  }

  // ---------- logistic map ----------
  // x_{n+1} = r * x_n * (1 - x_n)
  function logisticStep(x, r){
    return r * x * (1 - x);
  }

  // A persistent logistic stream used to drive global timing decisions
  let globalX = 0.4123;

  // ---------- params (bound to UI) ----------
  const params = {
    r: 3.70,
    angleJitter: 0.35,   // fraction of golden angle used as chaos-driven jitter
    density: 520,        // target max number of leaves alive
    speed: 1.0,          // spawn rate multiplier
    sizeScale: 1.0,      // leaf size multiplier
    fade: 0.06           // trail persistence (lower = longer trails)
  };

  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~137.5° in radians

  // ---------- leaf population ----------
  // Each leaf carries its own small logistic orbit (x) seeded from index,
  // which drives its size pulsation, sway, and opacity — deterministic chaos.
  let leaves = [];
  let leafIndex = 0;
  let spawnAccumulator = 0;
  let paused = false;
  let originX, originY;

  function resetSystem(){
    leaves = [];
    leafIndex = 0;
    spawnAccumulator = 0;
    globalX = 0.4123 + Math.random()*0.001; // tiny reseed so resets aren't identical
    originX = W/2;
    originY = H/2;
  }
  resetSystem();

  function spawnLeaf(){
    leafIndex++;

    // Fibonacci / phyllotaxis placement: ordered spiral via golden angle
    const n = leafIndex;
    const baseAngle = n * GOLDEN_ANGLE;

    // logistic-driven jitter on the angle — chaos perturbing the order
    globalX = logisticStep(globalX, params.r);
    const jitter = (globalX - 0.5) * params.angleJitter; // radians-ish
    const angle = baseAngle + jitter;

    // radius grows with sqrt(n) as in real phyllotaxis (even spacing by area)
    const c = Math.min(W, H) * 0.026;
    const radius = c * Math.sqrt(n);

    // each leaf gets its own logistic seed for independent lifelong flutter
    const seed = (Math.sin(n * 12.9898) * 43758.5453) % 1;
    const x0 = 0.15 + Math.abs(seed) * 0.7;

    // chaotic regime -> more size variance; ordered regime -> more uniform
    const sizeBase = 3.2 + Math.sqrt(n) * 0.02;

    leaves.push({
      angle: angle,
      radius: radius,
      x: x0,                  // this leaf's own logistic state
      born: performance.now(),
      size: sizeBase,
      colorT: Math.abs((globalX + seed) % 1),
      isGray: (Math.abs(seed*7) % 1) < 0.16, // occasional gray leaf, sparse
      swayPhase: seed * Math.PI * 2,
      alive: true
    });

    // cap population — oldest fade/drop first (handled in draw loop)
    const maxAlive = Math.round(params.density);
    if (leaves.length > maxAlive){
      leaves.splice(0, leaves.length - maxAlive);
    }
  }

  // ---------- leaf shape ----------
  function drawLeaf(x, y, angle, size, color, alpha){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;

    // simple pointed-leaf silhouette via bezier, oriented along local x-axis
    const L = size * 2.6;
    const Wd = size * 1.15;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(L*0.25, -Wd, L*0.75, -Wd*0.6, L, 0);
    ctx.bezierCurveTo(L*0.75, Wd*0.6, L*0.25, Wd, 0, 0);
    ctx.closePath();
    ctx.fill();

    // faint midrib
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = 'rgba(10,13,10,0.6)';
    ctx.lineWidth = Math.max(0.3, size*0.05);
    ctx.beginPath();
    ctx.moveTo(size*0.15,0);
    ctx.lineTo(L*0.92,0);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- UI wiring ----------
  const rSlider = document.getElementById('rSlider');
  const angleJitterSlider = document.getElementById('angleJitterSlider');
  const densitySlider = document.getElementById('densitySlider');
  const speedSlider = document.getElementById('speedSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const fadeSlider = document.getElementById('fadeSlider');

  const rLabel = document.getElementById('rLabel');
  const angleJitterLabel = document.getElementById('angleJitterLabel');
  const densityLabel = document.getElementById('densityLabel');
  const speedLabel = document.getElementById('speedLabel');
  const sizeLabel = document.getElementById('sizeLabel');
  const fadeLabel = document.getElementById('fadeLabel');
  const rReadout = document.getElementById('rReadout');
  const regimeReadout = document.getElementById('regimeReadout');

  function regimeName(r){
    if (r < 3.0) return 'stable — 収束';
    if (r < 3.4497) return 'periodic ×2';
    if (r < 3.544) return 'periodic ×4';
    if (r < 3.5699) return 'periodic — さらに分岐';
    return 'chaotic regime';
  }

  function syncLabels(){
    rLabel.textContent = params.r.toFixed(2);
    rReadout.textContent = params.r.toFixed(3);
    regimeReadout.textContent = regimeName(params.r);
    angleJitterLabel.textContent = params.angleJitter.toFixed(2);
    densityLabel.textContent = Math.round(params.density);
    speedLabel.textContent = params.speed.toFixed(2);
    sizeLabel.textContent = params.sizeScale.toFixed(2);
    fadeLabel.textContent = params.fade.toFixed(3);
    speedSlider.value = params.speed;
    sizeSlider.value = params.sizeScale;
  }

  rSlider.addEventListener('input', e=>{ params.r = parseFloat(e.target.value); syncLabels(); });
  angleJitterSlider.addEventListener('input', e=>{ params.angleJitter = parseFloat(e.target.value); syncLabels(); });
  densitySlider.addEventListener('input', e=>{ params.density = parseFloat(e.target.value); syncLabels(); });
  speedSlider.addEventListener('input', e=>{ params.speed = parseFloat(e.target.value); syncLabels(); });
  sizeSlider.addEventListener('input', e=>{ params.sizeScale = parseFloat(e.target.value); syncLabels(); });
  fadeSlider.addEventListener('input', e=>{ params.fade = parseFloat(e.target.value); syncLabels(); });
  syncLabels();

  document.getElementById('btnPause').addEventListener('click', (e)=>{
    paused = !paused;
    e.target.textContent = paused ? '再開' : '一時停止';
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    resetSystem();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = '#0a0d0a';
    ctx.fillRect(0,0,W,H);
  });

  const panel = document.getElementById('panel');
  const toggleHide = document.getElementById('toggleHide');
  let panelVisible = true;
  toggleHide.addEventListener('click', ()=>{
    panelVisible = !panelVisible;
    panel.classList.toggle('hidden', !panelVisible);
    toggleHide.textContent = panelVisible ? '操作パネルを隠す ⌄' : '操作パネルを表示 ⌃';
  });

  // Drag on the canvas (mouse or touch) adjusts speed / leaf size live,
  // instead of moving the spiral — keeps touch input from disturbing the piece.
  const dragHint = document.getElementById('dragHint');
  const speedRange = [parseFloat(speedSlider.min), parseFloat(speedSlider.max)];
  const sizeRange  = [parseFloat(sizeSlider.min),  parseFloat(sizeSlider.max)];
  const clamp = (v,lo,hi)=> Math.min(hi, Math.max(lo, v));

  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let dragStartSpeed = params.speed, dragStartSize = params.sizeScale;

  canvas.addEventListener('pointerdown', (e)=>{
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartSpeed = params.speed;
    dragStartSize = params.sizeScale;
    canvas.setPointerCapture(e.pointerId);
    dragHint.classList.add('show');
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e)=>{
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;

    // horizontal drag -> spawn speed, vertical drag -> leaf size
    params.speed = clamp(dragStartSpeed + (dx / W) * (speedRange[1]-speedRange[0]) * 1.4, speedRange[0], speedRange[1]);
    params.sizeScale = clamp(dragStartSize - (dy / H) * (sizeRange[1]-sizeRange[0]) * 1.4, sizeRange[0], sizeRange[1]);
    syncLabels();
    e.preventDefault();
  });

  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    dragHint.classList.remove('show');
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- initial background ----------
  ctx.fillStyle = '#0a0d0a';
  ctx.fillRect(0,0,W,H);

  // ---------- animation loop ----------
  let lastT = performance.now();

  function frame(now){
    const dt = Math.min(50, now - lastT);
    lastT = now;

    if (!paused){
      // fade trail — leaves and their fading trace, forming a soft field
      ctx.fillStyle = `rgba(10,13,10,${params.fade})`;
      ctx.fillRect(0,0,W,H);

      // spawn according to speed, driven partly by logistic step (irregular timing)
      spawnAccumulator += dt * 0.001 * params.speed * (9 + 6*Math.sin(globalX*10));
      while (spawnAccumulator > 1){
        spawnLeaf();
        spawnAccumulator -= 1;
      }

      // draw all leaves
      const t = now * 0.001;
      const maxR = Math.min(W,H) * 0.026 * Math.sqrt(Math.max(1,leaves.length));

      for (let i=0;i<leaves.length;i++){
        const lf = leaves[i];

        // advance this leaf's own tiny logistic orbit — local flutter
        lf.x = logisticStep(lf.x, params.r);
        if (!isFinite(lf.x) || lf.x <= 0 || lf.x >= 1){
          lf.x = 0.2 + 0.6*Math.abs(Math.sin(i*3.1));
        }

        const age = (now - lf.born) * 0.001;
        const growIn = Math.min(1, age / 1.6); // gentle emergence

        // radius drifts very slightly outward over time (organic growth)
        const r = lf.radius * (1 + 0.02*Math.min(age,10)/10);

        const sway = Math.sin(t*0.6 + lf.swayPhase) * (0.04 + lf.x*0.10);
        const ang = lf.angle + sway;

        const x = originX + Math.cos(ang) * r;
        const y = originY + Math.sin(ang) * r;

        if (x < -40 || x > W+40 || y < -40 || y > H+40) continue;

        // size pulses with the leaf's own logistic value — chaos in scale
        const size = lf.size * params.sizeScale * (0.7 + lf.x*0.9) * growIn;

        // color: mostly green gradient by radial position, sparse gray accents
        const radialT = Math.min(1, r / (maxR||1));
        let color;
        if (lf.isGray){
          const gi = Math.floor(lf.x * GRAYS.length) % GRAYS.length;
          color = GRAYS[gi];
        } else {
          // blend colorT (birth-chaos) with radial position for depth
          const mix = Math.min(1, Math.max(0, lf.colorT*0.5 + radialT*0.5));
          color = pickGreen(mix);
        }

        const alpha = 0.55 + 0.4*growIn*(0.5+0.5*Math.sin(lf.x*Math.PI));

        drawLeaf(x, y, ang + Math.PI*0.02*Math.sin(lf.x*6), size, color, Math.min(0.95,alpha));
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
